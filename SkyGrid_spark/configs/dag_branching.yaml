# Structurally different DAG instance #2: "branching".
#
# Same fabric, workload, and mechanism parameters as default.yaml; only
# the ``dag`` block differs.  After the neural stage the pipeline forks
# into two symbolic branches -- rule_check -> conformal, and a second
# geofence_check branch -- that reconverge at audit.  This tests a DAG
# with parallel SYM paths and a join, instead of the default linear
# chain.  It is *not* a calibrated model of any particular application.
#
# Per-op notes:
#   feat_extract    2.0e6 FLOPs, NN, R=0   -- unchanged from default
#   risk_score      1.2e8 FLOPs, NN, R=0   -- unchanged from default
#   rule_check      5.0e5 FLOPs, SYM, R=8  -- unchanged from default
#   geofence_check  4.0e5 FLOPs, SYM, R=6  -- new parallel branch; cost
#                                             and fan-out chosen between
#                                             rule_check and conformal
#   conformal       8.0e5 FLOPs, SYM, R=4  -- unchanged from default
#   audit           2.0e5 FLOPs, SYM, R=2  -- join of both branches
# Note: the simulator charges cross-edge *peer feature* traffic only for
# the operator named ``rule_check`` (as in the default DAG); other SYM
# ops pay the state-tier latency but no peer bytes.

seed: 20260928

workload:
  name: city_medium
  num_entities: 10000
  area_km: 8.0
  duration_s: 60.0
  event_rate_per_entity_s: 1.5
  mobility:
    model: corridor
    speed_mps: 12.0
    corridor_sigma: 0.02
  jitter:
    cov: 0.35

dag:
  ops:
    - {name: feat_extract,   kind: nn,      cost_flops: 2.0e6, input_bytes: 512, output_bytes: 256, prefers: edge,  batchable: true,  batch_sweet: 32, state_refs: 0}
    - {name: risk_score,     kind: nn,      cost_flops: 1.2e8, input_bytes: 256, output_bytes: 64,  prefers: cloud, batchable: true,  batch_sweet: 64, state_refs: 0}
    - {name: rule_check,     kind: symbolic,cost_flops: 5.0e5, input_bytes: 320, output_bytes: 32,  prefers: edge,  batchable: false, batch_sweet: 1,  state_refs: 8}
    - {name: geofence_check, kind: symbolic,cost_flops: 4.0e5, input_bytes: 128, output_bytes: 32,  prefers: edge,  batchable: false, batch_sweet: 1,  state_refs: 6}
    - {name: conformal,      kind: symbolic,cost_flops: 8.0e5, input_bytes: 96,  output_bytes: 32,  prefers: edge,  batchable: false, batch_sweet: 1,  state_refs: 4}
    - {name: audit,          kind: symbolic,cost_flops: 2.0e5, input_bytes: 64,  output_bytes: 16,  prefers: edge,  batchable: false, batch_sweet: 1,  state_refs: 2}
  edges:
    - [feat_extract,   risk_score]
    - [feat_extract,   rule_check]
    - [risk_score,     rule_check]
    - [risk_score,     geofence_check]
    - [rule_check,     conformal]
    - [conformal,      audit]
    - [geofence_check, audit]

fabric:
  cloud:
    num_devices: 1
    tflops: 2.4
    queue_capacity: 20000
  edge:
    num_nodes: 4
    tflops: 1.0
    queue_capacity: 2048
    memory_gb: 128.0
    storage_iops: 1500000
    rdma_bw_gbps: 100.0
  network:
    edge_cloud_latency_ms: 12.0
    edge_cloud_bw_gbps: 1.0
    edge_edge_latency_ms: 4.0
    edge_edge_bw_gbps: 0.5
    jitter_ms: 1.5
  state_tier:
    hot_capacity: 10000
    hot_latency_ms: 0.001
    warm_capacity: 100000
    warm_latency_ms: 0.020
    cold_latency_ms: 12.0
    hot_hit_rate: 0.70
    warm_hit_rate: 0.25
    enabled: true

partition:
  method: stp
  grid:
    cells_per_side: 16
  stp:
    alpha_spatial: 1.0
    beta_ruledep: 0.6
    gamma_balance: 0.4
    refine_iters: 2
  rebalance:
    trigger_imbalance: 1.25
    amortize_every_s: 10.0

placement:
  method: cop
  cop:
    epsilon: 0.10
    max_swaps: 64

pipeline:
  method: abp
  abp:
    microbatch_max: 64
    microbatch_timeout_ms: 8.0
    staleness_bound: 2
    backpressure_watermark_high: 0.85
    backpressure_watermark_low: 0.55

output_dir: outputs
